---
- name: Ensure required packages are installed
  package:
    name: "{{ item }}"
    state: present
  loop:
    - wget
    - unzip
  tags: install

- name: Create WildFly user
  user:
    name: "{{ wildfly_user }}"
    system: yes
    state: present
  tags: install

- name: Create installation directory
  file:
    path: "{{ wildfly_install_dir }}"
    state: directory
    owner: "{{ wildfly_user }}"
    group: "{{ wildfly_user }}"
    mode: '0755'
  tags: install

- name: Download WildFly archive
  get_url:
    url: "{{ wildfly_download_url }}"
    dest: "/tmp/wildfly-{{ wildfly_version }}.zip"
    mode: '0644'
  tags: install

- name: Extract WildFly archive
  unarchive:
    src: "/tmp/wildfly-{{ wildfly_version }}.zip"
    dest: "{{ wildfly_install_dir }}"
    remote_src: yes
    creates: "{{ wildfly_install_dir }}/wildfly-{{ wildfly_version }}"
  tags: install

- name: Ensure ownership of WildFly installation
  file:
    path: "{{ wildfly_install_dir }}/wildfly-{{ wildfly_version }}"
    owner: "{{ wildfly_user }}"
    group: "{{ wildfly_user }}"
    recurse: yes
  tags: install

- name: Set WILDFLY_HOME environment variable
  lineinfile:
    path: /etc/environment
    line: 'WILDFLY_HOME="{{ wildfly_install_dir }}/wildfly-{{ wildfly_version }}"'
    create: yes
  tags: install

- name: Create systemd service file for WildFly
  template:
    src: wildfly.service.j2
    dest: "{{ wildfly_service_file }}"
    owner: root
    group: root
    mode: '0644'
  notify: Reload Systemd Daemon
  tags: install

- name: Enable and start WildFly service
  systemd:
    name: wildfly
    state: started
    enabled: yes
  tags: install
