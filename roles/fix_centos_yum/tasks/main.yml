---
- name: Backup original CentOS-Base.repo
  copy:
    src: /etc/yum.repos.d/CentOS-Base.repo
    dest: /etc/yum.repos.d/CentOS-Base.repo.bak
    remote_src: yes
  when: ansible_distribution == "CentOS" and ansible_distribution_major_version == "7"

- name: Replace with working CentOS 7 base repo file
  template:
    src: CentOS-Base.repo.j2
    dest: /etc/yum.repos.d/CentOS-Base.repo
    mode: '0644'
  when: ansible_distribution == "CentOS" and ansible_distribution_major_version == "7"
  notify: clean_yum_cache
